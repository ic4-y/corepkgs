name: Nix

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:

    runs-on: ubuntu-latest

    # Surfaced for the guarded cache push below: a step-level `if` cannot read `secrets`, but a
    # job-level env can, and an empty value simply skips the push.
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      FORMAT_ARTIFACT_TOKEN: ${{ secrets.FORMAT_ARTIFACT_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    # POPULATE THE BINARY CACHE. The derivations this gate needs are not on cache.nixos.org —
    # measured: `mystmd` is, the `content-format` validator is not, and neither is in
    # ekala-corepkgs.cachix.org. A consumer that pins this repository (the site does, through
    # npins) re-declares this cache in its own nixConfig precisely so it substitutes rather than
    # builds, so what is pushed here is what makes that true.
    #
    # Guarded on the token: with no CACHIX_AUTH_TOKEN secret the step is SKIPPED, so the
    # workflow is green on a fork that has no credentials, and starts populating the cache the
    # moment the token is added. The cache name and public key are the README's and this file's
    # own `extra-substituters`, not a second cache.
    - uses: cachix/cachix-action@v15
      if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
      with:
        name: ekala-corepkgs
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Push only what THIS job produced. Pushing the whole closure re-uploads every
        # nixpkgs path already on cache.nixos.org, which is what makes a naive push slow.
        pushFilter: '(-source$|-docs-content-format-check$|content-format)'
    - name: Nix Lint
      run: nix fmt . -- --ci

  eval:

    runs-on: ubuntu-latest

    # Surfaced for the guarded cache push below: a step-level `if` cannot read `secrets`, but a
    # job-level env can, and an empty value simply skips the push.
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      FORMAT_ARTIFACT_TOKEN: ${{ secrets.FORMAT_ARTIFACT_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    # POPULATE THE BINARY CACHE. The derivations this gate needs are not on cache.nixos.org —
    # measured: `mystmd` is, the `content-format` validator is not, and neither is in
    # ekala-corepkgs.cachix.org. A consumer that pins this repository (the site does, through
    # npins) re-declares this cache in its own nixConfig precisely so it substitutes rather than
    # builds, so what is pushed here is what makes that true.
    #
    # Guarded on the token: with no CACHIX_AUTH_TOKEN secret the step is SKIPPED, so the
    # workflow is green on a fork that has no credentials, and starts populating the cache the
    # moment the token is added. The cache name and public key are the README's and this file's
    # own `extra-substituters`, not a second cache.
    - uses: cachix/cachix-action@v15
      if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
      with:
        name: ekala-corepkgs
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Push only what THIS job produced. Pushing the whole closure re-uploads every
        # nixpkgs path already on cache.nixos.org, which is what makes a naive push slow.
        pushFilter: '(-source$|-docs-content-format-check$|content-format)'
    - name: Evaluate all packages
      run: ./ci/eval.sh

  docs:

    runs-on: ubuntu-latest

    # Surfaced for the guarded cache push below: a step-level `if` cannot read `secrets`, but a
    # job-level env can, and an empty value simply skips the push.
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      FORMAT_ARTIFACT_TOKEN: ${{ secrets.FORMAT_ARTIFACT_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    # THE ENFORCING SURFACE for the content-format contract (docs/dag/pr-dag.json ->
    # ContentFormat, UFC-5.1/5.2). With no hooks installed and core.hooksPath unset — which is
    # the state of a fresh clone and of this runner — a page edited without regenerating its
    # committed JSON, or a hand-edited JSON, fails HERE.
    #
    # This builds `checks.<system>.docs`, which runs `scripts/docs-pipeline.sh --check` against
    # a copy of the tree with the emitter and validator on PATH. It is a derivation rather than
    # `nix develop -c ...` so the gate is hermetic and cacheable, and it is the same script the
    # two hooks invoke — three callers, one implementation, so none of them can drift. The
    # system is named because a flake check is system-addressed.
    # POPULATE THE BINARY CACHE. The derivations this gate needs are not on cache.nixos.org —
    # measured: `mystmd` is, the `content-format` validator is not, and neither is in
    # ekala-corepkgs.cachix.org. A consumer that pins this repository (the site does, through
    # npins) re-declares this cache in its own nixConfig precisely so it substitutes rather than
    # builds, so what is pushed here is what makes that true.
    #
    # Guarded on the token: with no CACHIX_AUTH_TOKEN secret the step is SKIPPED, so the
    # workflow is green on a fork that has no credentials, and starts populating the cache the
    # moment the token is added. The cache name and public key are the README's and this file's
    # own `extra-substituters`, not a second cache.
    - uses: cachix/cachix-action@v15
      if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
      with:
        name: ekala-corepkgs
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        # Push only what THIS job produced. Pushing the whole closure re-uploads every
        # nixpkgs path already on cache.nixos.org, which is what makes a naive push slow.
        pushFilter: '(-source$|-docs-content-format-check$|content-format)'
    # THE PRIVATE PINNED INPUT. The `ekala-org` flake input lives in a private repository while
    # this fork is public, so a runner here cannot fetch it and the job fails at flake eval with
    # `program 'git' failed with exit code 128` before the gate ever runs (drift D15). This step
    # supplies the token when one is configured and is SKIPPED otherwise, so the failure is
    # attributable rather than mysterious, and setting the secret is the only remaining step.
    - name: Authenticate the pinned content-format input
      if: ${{ env.FORMAT_ARTIFACT_TOKEN != '' }}
      run: echo "access-tokens = github.com=$FORMAT_ARTIFACT_TOKEN" | sudo tee -a /etc/nix/nix.conf

    - name: Docs content gate
      run: nix build --print-out-paths .#checks.x86_64-linux.docs
