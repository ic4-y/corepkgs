name: Nix

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    - name: Nix Lint
      run: nix fmt . -- --ci

  eval:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    - name: Evaluate all packages
      run: ./ci/eval.sh

  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        extra_nix_config: |
          extra-substituters = https://ekala-corepkgs.cachix.org
          extra-trusted-public-keys = ekala-corepkgs.cachix.org-1:DcZV+vegWoEzacbSdXFXU4S7728C0eS9RfGpKeyHd6w=
    # THE ENFORCING SURFACE for the content-format contract (docs/dag/pr-dag.json ->
    # ContentFormat, UFC-5.1/5.2). With no hooks installed and core.hooksPath unset — which is
    # the state of a fresh clone and of this runner — a page edited without regenerating its
    # committed JSON, or a hand-edited JSON, fails HERE.
    #
    # Invoked through the devshell, because the validator comes from the pinned flake input and
    # the emitter from the pinned nixpkgs; neither is on the runner's PATH otherwise. This is
    # also why `nix flake check` is not the gate: it does not run a devshell command.
    - name: Docs content gate
      run: nix develop .#default -c bash scripts/docs-pipeline.sh --check
